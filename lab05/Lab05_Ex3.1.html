<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nhiệm vụ 2.2 - Infographic và video</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			line-height: 1.6;
			color: #1f2937;
			background: #f3f4f6;
		}
		main {
			width: min(100% - 32px, 1000px);
			margin: 32px auto;
			padding: 28px;
			background: #fff;
			border-radius: 14px;
			box-shadow: 0 4px 18px rgba(0, 0, 0, .1);
		}
		h1 { margin-top: 0; color: #174ea6; text-align: center; }
		h2 { color: #174ea6; margin-top: 28px; }
		.description { text-align: center; color: #4b5563; }
		.infographic {
			display: block;
			width: 100%;
			height: auto;
			margin: 18px auto;
			border: 1px solid #e5e7eb;
			border-radius: 8px;
		}
		.video { position: relative; padding-top: 56.25%; overflow: hidden; border-radius: 8px; }
		.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
		footer { margin-top: 24px; font-size: .9rem; color: #6b7280; text-align: center; }
	</style>
</head>
<body>
	<main>
		<h1>Nhiệm vụ 2.2</h1>
		<p class="description">Infographic minh họa nội dung bài tập và video hướng dẫn thực hiện Nhiệm vụ 2.2.</p>

		<h2>Infographic</h2>
		<img class="infographic" src="Lab05_Ex2.1.png" alt="Infographic của Nhiệm vụ 2.2">

		<h2>Video hướng dẫn</h2>
		<div class="video">
			<iframe src="https://www.youtube.com/embed/0Rbfu-m1mZQ"
					title="Video hướng dẫn Nhiệm vụ 2.2"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					allowfullscreen></iframe>
		</div>

		<footer>© 2024 - Nội dung và hình ảnh được sử dụng cho mục đích học tập. Bản quyền video thuộc về chủ sở hữu trên YouTube.</footer>
	</main>
</body>
</html>
